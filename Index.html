<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strong Password Generator</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #2563eb);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #111827;
    }

    .password-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #password {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .option {
      margin: 12px 0;
    }

    input[type="number"] {
      width: 70px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    label {
      cursor: pointer;
    }

    .generate {
      width: 100%;
      margin-top: 15px;
      font-size: 17px;
      font-weight: bold;
    }

    .copy {
      background: #16a34a;
    }

    .copy:hover {
      background: #15803d;
    }

    #strength {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔐 Password Generator</h1>

    <div class="password-box">
      <input type="text" id="password" readonly placeholder="Your password">
      <button onclick="copyPassword()">Copy</button>
    </div>

    <div class="option">
      <label>Password Length:</label>
      <input type="number" id="length" value="16" min="6" max="50">
    </div>

    <div class="option">
      <label>
        <input type="checkbox" id="uppercase" checked>
        Uppercase (A-Z)
      </label>
    </div>

    <div class="option">
      <label>
        <input type="checkbox" id="lowercase" checked>
        Lowercase (a-z)
      </label>
    </div>

    <div class="option">
      <label>
        <input type="checkbox" id="numbers" checked>
        Numbers (0-9)
      </label>
    </div>

    <div class="option">
      <label>
        <input type="checkbox" id="symbols" checked>
        Symbols (!@#$)
      </label>
    </div>

    <button class="generate" onclick="generatePassword()">
      Generate Password
    </button>

    <div id="strength"></div>

  </div>

  <script>

    function generatePassword() {

      const length = parseInt(document.getElementById("length").value);

      const uppercase = document.getElementById("uppercase").checked;
      const lowercase = document.getElementById("lowercase").checked;
      const numbers = document.getElementById("numbers").checked;
